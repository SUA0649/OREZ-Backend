version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgresdb
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: orez
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: orez_redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
