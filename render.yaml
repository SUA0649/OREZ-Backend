services:
  - type: web
    name: orez-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orez-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: orez-redis
          property: connectionString

databases:
  - name: orez-db
    databaseName: appdb
    user: orez

redis:
  - name: orez-redis
    plan: free
